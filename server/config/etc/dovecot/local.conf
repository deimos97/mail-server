protocols = imap lmtp
mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

auth_username_format = %Lu
auth_mechanisms = plain login xoauth2 oauthbearer
disable_plaintext_auth = yes

ssl = required
ssl_cert = </etc/letsencrypt/live/mail.unagrandeylibre.es/fullchain.pem
ssl_key = </etc/letsencrypt/live/mail.unagrandeylibre.es/privkey.pem
ssl_min_protocol = TLSv1.2

service imap-login {
  inet_listener imap { 
    port = 0 
  }
  inet_listener imaps { 
    port = 993
    ssl = yes
  }
}

mail_plugins = $mail_plugins quota quota_clone
protocol imap {
 mail_plugins = $mail_plugins imap_quota last_login
}
plugin {
 quota = maildir:User quota 
}

postmaster_address = postmaster@unagrandeylibre.es

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

# Spam routing: Rspamd's X-Spam header -> Junk via a global sieve_before script.
# Must stay after the global mail_plugins line above so LMTP keeps quota.
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}
plugin {
  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_before = /etc/dovecot/sieve/spam-to-junk.sieve
}

# Contraseñas por dispositivo (Fase 2). Va después de la passdb principal (auth-sql.conf.ext):
# si la contraseña del buzón no coincide, Dovecot prueba aquí. El SMTP autentica por Dovecot, así que vale para enviar.
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql-app-passwords.conf.ext
}

# Uso de cuota y último acceso en MariaDB para la web (Fase 3). Ver server/sql/2026-10-08-uso-de-buzones.sql.
# quota_clone copia el uso (la cuota real sigue siendo la de maildir); last_login guarda el último acceso
# IMAP por dispositivo: app_password_id lo pone la passdb de contraseñas de dispositivo (0 = webmail).
dict {
  usage = mysql:/etc/dovecot/dovecot-dict-sql.conf.ext
}
service dict {
  unix_listener dict {
    mode = 0600
    user = vmail
  }
}
plugin {
  quota_clone_dict = proxy::usage
  last_login_dict = proxy::usage
  last_login_key = last-login/%u/%{userdb:app_password_id:0}
}
