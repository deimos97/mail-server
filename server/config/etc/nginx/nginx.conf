user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {
	charset utf-8;
	keepalive_timeout 7;
	index index.php index.html index.htm;

	log_format custom_access "$remote_addr ($http_x_forwarded_for) [$time_local] req:\"$request\" code:\"$status\" sentB:\"$body_bytes_sent\" ref:\"$http_referer\" agent:\"$http_user_agent\" host:\"$host\"";

	client_max_body_size 100M;


	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off; # hide nginx version

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;
	gzip_disable "MSIE [1-6].(?!.*SV1)";

	# gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_types text/plain text/css text/xml  text/x-component text/javascript application/javascript application/x-javascript application/xml application/xhtml+xml application/xml+rss application/json application/x-font-ttf application/x-font-opentype application/vnd.ms-fontobject image/svg+xml image/x-icon image/bmp;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


