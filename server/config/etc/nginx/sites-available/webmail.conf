server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name webmail.unagrandeylibre.es;

    ssl_certificate     /etc/letsencrypt/live/mail.unagrandeylibre.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.unagrandeylibre.es/privkey.pem;

    root /var/lib/roundcube/public_html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    # Roundcube usa rutas tipo /index.php/login/oauth (PATH_INFO) para volver del login único
    location ~ ^/index\.php(/.*)$ {
        fastcgi_split_path_info ^(/index\.php)(/.*)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/webmail.sock;
        include fastcgi_params;
    }
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/webmail.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    location ~ /\.(?!well-known) { deny all; }
}
server {
    listen 80;
    listen [::]:80;
    server_name webmail.unagrandeylibre.es;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mail;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
