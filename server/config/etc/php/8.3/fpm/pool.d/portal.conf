; Pool de la web (portal/). Aislado del webmail: usuario, socket y rutas propios.
[portal]
user = portal
group = portal
listen = /run/php/portal.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

clear_env = yes
php_admin_value[open_basedir] = /var/www/portal/:/usr/share/php/:/etc/mime.types:/dev/urandom
php_admin_value[upload_tmp_dir] = /var/www/portal/shared/tmp
php_admin_value[sys_temp_dir] = /var/www/portal/shared/tmp
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 256M
php_admin_flag[expose_php] = off
php_admin_value[error_log] = /var/www/portal/shared/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on
