# Correo transaccional de la web (verificaciones, recuperar contraseña…): sin límite por usuario
whitelisted_user = ["noreply@unagrandeylibre.es"];

# Límites de envío por plan (Fase 4). Los buzones de pago salen de los mapas ugl_* (rspamd.local.lua);
# el resto (gratis, o un tier sin cubo) va al del plan gratis. Los números son los de `send_limit_per_hour`
# de cada plan en el admin: si cambian allí, cámbialos aquí.
rates {
  user = {
    selector = "user.lower.except_map(ugl_paid)";
    bucket = { burst = 20; rate = "20 / 1h"; }
  }
  user_basic = {
    selector = "user.lower.filter_map(ugl_basic)";
    bucket = { burst = 100; rate = "100 / 1h"; }
  }
  user_pro = {
    selector = "user.lower.filter_map(ugl_pro)";
    bucket = { burst = 300; rate = "300 / 1h"; }
  }
}
