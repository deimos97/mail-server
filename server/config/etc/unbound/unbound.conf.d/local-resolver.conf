# Local recursive resolver so DNSBL queries (Spamhaus etc.) come from this
# server's own IP instead of Hetzner's shared resolvers, which Spamhaus refuses.
server:
    interface: 127.0.0.1
    port: 53
    access-control: 127.0.0.0/8 allow
    do-ip6: no
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    prefetch: yes
